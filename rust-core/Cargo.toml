[package]
name = "routeflow-core"
version = "0.1.0"
edition = "2021"
description = "RouteFlow routing core - domain-based network interface selection"

[lib]
name = "routeflow_core"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

[build-dependencies]
cbindgen = "0.27"

[[bin]]
name = "routeflow-cli"
path = "src/bin/cli.rs"
